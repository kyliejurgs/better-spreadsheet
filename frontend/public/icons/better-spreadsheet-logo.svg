<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 180"
  role="img"
  aria-label="Better Spreadsheet"
>
  <!-- Spreadsheet grid -->
  <g fill="currentColor">
    <!-- Row 1 -->
    <rect x="103" y="20" width="30" height="28" rx="2" opacity="0.40" />

    <!-- Top-right: only top-right corner rounded -->
    <path
      d="
        M137 20
        H161
        Q167 20 167 26
        V48
        H137
        Z
      "
      opacity="0.40"
    />

    <!-- Row 2 -->
    <rect x="103" y="52" width="30" height="28" rx="2" opacity="0.55" />
    <rect x="137" y="52" width="30" height="28" rx="2" opacity="0.55" />

    <!-- Row 3 -->
    <rect x="103" y="84" width="30" height="28" rx="2" opacity="0.70" />
    <rect x="137" y="84" width="30" height="28" rx="2" opacity="0.70" />

    <!-- Row 4 -->
    <rect x="103" y="116" width="30" height="28" rx="2" opacity="0.85" />

    <!-- Bottom-right: only bottom-right corner rounded -->
    <path
      d="
        M137 116
        H167
        V138
        Q167 144 161 144
        H137
        Z
      "
      opacity="0.85"
    />
  </g>

  <!-- BS panel -->
  <path
    fill="currentColor"
    d="
      M22 25
      L101 7
      Q110 5 110 15
      V151
      Q110 160 101 158
      L22 145
      Q14 144 14 136
      V35
      Q14 27 22 25
      Z
    "
  />

  <!-- BS -->
  <text
    x="62"
    y="107"
    fill="white"
    text-anchor="middle"
    font-family="Inter, sans-serif"
    font-size="55"
    font-weight="700"
    letter-spacing="-2"
  >
    BS
  </text>
</svg>