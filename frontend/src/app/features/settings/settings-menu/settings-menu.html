<button
  class="settings-menu__trigger"
  type="button"
  aria-label="Settings"
  tuiDropdownAlign="end"
  tuiDropdownSided
  [tuiDropdown]="settingsMenu"
  [(tuiDropdownOpen)]="open"
>
  <tui-icon icon="@font.settings" />
</button>

<ng-template #settingsMenu>
  <tui-data-list class="settings-menu__popup" role="menu" tuiDataListDropdownManager size="s">
    <button tuiOption type="button" iconStart="@font.settings">Settings</button>
    <button tuiOption type="button" iconStart="@font.keyboard">Keyboard Shortcuts</button>

    <hr />

    <button
      tuiOption
      type="button"
      iconStart="@font.palette"
      iconEnd="@font.chevron_right"
      tuiDropdownAlign="end"
      tuiDropdownSided
      [tuiDropdown]="themeMenu"
    >
      Themes
    </button>
  </tui-data-list>
</ng-template>

<ng-template #themeMenu>
  <tui-data-list class="settings-menu__theme-popup" role="menu" tuiDataListDropdownManager size="s">
    @for (item of themes; track item) {
      <button tuiOption type="button" (click)="setTheme(item)">
        <span class="settings-menu__check">
          @if (theme() === item) {
            <tui-icon icon="@font.check" />
          }
        </span>
        {{ item }}
      </button>
    }
  </tui-data-list>
</ng-template>
