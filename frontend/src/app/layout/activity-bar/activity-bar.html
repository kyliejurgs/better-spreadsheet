<nav class="activity-bar" aria-label="Application Navigation">
  <div class="activity-bar__primary">
    <button
      class="activity-bar__item"
      [class.activity-bar__item--active]="activePanelContent() === 'explorer'"
      type="button"
      aria-label="Explorer"
      title="Explorer"
      (click)="selectContent('explorer')"
    >
      <i class="codicon codicon-library" aria-hidden="true"></i>
    </button>

    <button
      class="activity-bar__item"
      [class.activity-bar__item--active]="activePanelContent() === 'search'"
      type="button"
      aria-label="Search"
      title="Search"
      (click)="selectContent('search')"
    >
      <i class="codicon codicon-search" aria-hidden="true"></i>
    </button>
  </div>

  <div class="activity-bar__secondary">
    <button class="activity-bar__item" type="button" aria-label="Home" title="Home">
      <i class="codicon codicon-home" aria-hidden="true"></i>
    </button>

    <button class="activity-bar__item" type="button" aria-label="Settings" title="Settings">
      <i class="codicon codicon-settings-gear" aria-hidden="true"></i>
    </button>
  </div>
</nav>
