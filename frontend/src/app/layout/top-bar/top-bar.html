<header class="top-bar">
  <div class="top-bar__left">
    <div class="top-bar__brand">
      <app-logo class="top-bar__logo" />
      <span class="top-bar__title">Better Spreadsheet</span>
    </div>

    <div class="top-bar__history">
      <button class="top-bar__action" type="button" aria-label="Undo" title="Undo">
        <i class="codicon codicon-discard" aria-hidden="true"></i>
      </button>

      <button class="top-bar__action" type="button" aria-label="Redo" title="Redo">
        <i class="codicon codicon-redo" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="top-bar__profile">
    <button class="top-bar__action" type="button" aria-label="Profile" title="Profile">
      <i class="codicon codicon-account" aria-hidden="true"></i>
    </button>
  </div>
</header>
