<div class="application-layout">
  <div class="application-header">
    <app-logo-area />
    <app-header />
  </div>

  <div class="application-body">
    <app-activity-bar />

    <div class="main-workspace">
      @if (leftPanelActualWidth() > 0) {
        <app-resizable-container
          class="panel-resizable-container"
          [size]="{ width: leftPanelActualWidth() }"
          [style.width.px]="leftPanelActualWidth()"
          (sizeChange)="resizeLeftPanel($event)"
        >
          <app-left-panel />
          <div resizeHandle="right" class="panel-resize-handle panel-resize-handle-right"></div>
        </app-resizable-container>
        <div class="panel-gap"></div>
      }

      <app-center-area
        [bottomPanelHeight]="bottomPanelActualHeight()"
        (bottomPanelHeightChange)="resizeBottomPanel($event)"
      />

      @if (rightPanelActualWidth() > 0) {
        <div class="panel-gap"></div>

        <app-resizable-container
          class="panel-resizable-container"
          [size]="{ width: rightPanelActualWidth() }"
          [style.width.px]="rightPanelActualWidth()"
          (sizeChange)="resizeRightPanel($event)"
        >
          <app-right-panel />
          <div resizeHandle="left" class="panel-resize-handle panel-resize-handle-left"></div>
        </app-resizable-container>
      }
    </div>
  </div>

  <app-status-bar />
</div>
