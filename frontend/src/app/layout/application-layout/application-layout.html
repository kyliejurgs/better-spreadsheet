<div class="application-layout">
  <div class="application-header">
    <app-logo-area />
    <app-header />
  </div>

  <div class="application-body">
    <app-activity-bar />

    <div class="main-workspace">
      @if (leftPanelActualWidth() > 0) {
        <app-left-panel [style.width.px]="leftPanelActualWidth()" />

        <div class="resize-handle resize-handle-horizontal"></div>
      }

      <app-center-area />

      @if (rightPanelActualWidth() > 0) {
        <div class="resize-handle resize-handle-horizontal"></div>

        <app-right-panel [style.width.px]="rightPanelActualWidth()" />
      }
    </div>
  </div>

  <app-status-bar />
</div>
