<div class="center-area">
  <app-work-area />

  @if (bottomPanelVisible()) {
    <div class="panel-gap"></div>

    <app-resizable-panel
      direction="top"
      [size]="bottomPanelSize()"
      (sizeChange)="bottomPanelSizeChange.emit($event)"
    >
      <app-bottom-panel />
    </app-resizable-panel>
  }
</div>
